name = "stackedactors"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "dist"
binding = "ASSETS"
# Client-side routing: unknown paths fall through to the SPA.
not_found_handling = "single-page-application"
# Assets are served before the Worker by default, which would mean /audio/*
# and the robots.txt override never reach our code. Run the Worker first on
# those paths only; everything else still gets the fast asset path.
run_worker_first = ["/audio/*", "/robots.txt", "/vault-*"]

[[r2_buckets]]
binding = "MIXES"
bucket_name = "stackedactors-mixes"

# VAULT_PATH is deliberately NOT set here - this file is in git, and the vault
# path is the only thing gating the vault. It is set as a Worker secret:
#
#   npx wrangler secret put VAULT_PATH
#
# and must match VITE_VAULT_PATH in .env.local (also gitignored) at build time.
# See README - "The vault".

# Both hostnames serve the site directly - no redirect hop between them.
# The MX records for this zone point at IONOS and must be left alone; attaching
# a Worker custom domain only replaces the A/AAAA/CNAME web records.
[[routes]]
pattern = "stackedactors.com"
custom_domain = true

[[routes]]
pattern = "www.stackedactors.com"
custom_domain = true
